name: Deploy Alliance Matrimony website

on:
  push:
    branches: [main]
    paths:
      - 'web/homepage.html'
      - 'web/features.html'
      - 'web/site.css'
      - 'web/terms.html'
      - 'web/privacy.html'
      - 'web/refunds.html'
      - 'web/delete-account.html'
      - 'web/support.html'
      - 'web/child-safety.html'
      - 'web/admin-recover.html'
      - 'web/membership.html'
      - 'web/payment-success.html'
      - 'web/payu_checkout.js'
      - 'assets/images/alliance_app_icon.png'
      - 'web/CNAME'
      - '.github/workflows/deploy-deletion-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website
        run: |
          mkdir -p _site/assets/images
          cp web/homepage.html _site/index.html
          cp web/features.html _site/features.html
          cp web/delete-account.html _site/delete-account.html
          cp web/support.html _site/support.html
          cp web/admin-recover.html _site/admin-recover.html
          cp web/terms.html _site/terms.html
          cp web/privacy.html _site/privacy.html
          cp web/refunds.html _site/refunds.html
          cp web/child-safety.html _site/child-safety.html
          cp web/membership.html _site/membership.html
          cp web/payment-success.html _site/payment-success.html
          cp web/payu_checkout.js _site/payu_checkout.js
          cp web/site.css _site/site.css
          cp assets/images/alliance_app_icon.png _site/assets/images/alliance_app_icon.png
          cp web/CNAME _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
