<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reset password | Alliance Matrimony</title>
  <style>
    :root { color-scheme: light; --ink:#281720; --muted:#765d68; --rose:#a83255; --line:#ead9dc; --paper:#fffdfc; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); background:#f8eff1; font-family:"Segoe UI",Arial,sans-serif; }
    main { width:min(100%,440px); }
    .brand { color:var(--rose); font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
    h1 { margin:16px 0 8px; font-family:Georgia,serif; font-size:36px; font-weight:500; }
    p { color:var(--muted); line-height:1.55; }
    form { margin-top:24px; padding:24px; border:1px solid var(--line); border-radius:12px; background:var(--paper); }
    form[hidden] { display:none; }
    label { display:block; margin:0 0 7px; font-size:13px; font-weight:700; }
    input { width:100%; margin:0 0 18px; padding:13px; border:1px solid #d4c1c6; border-radius:7px; font-size:16px; }
    button { width:100%; padding:14px; border:0; border-radius:7px; color:white; background:var(--rose); font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:24px; font-size:14px; }
    #status.error { color:#a52222; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="brand">Alliance Matrimony</div>
    <h1>Reset your password</h1>
    <p>Choose a new password for your account. Recovery links can only be used once.</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button id="reset-submit" type="submit">Update password</button>
    </form>
    <form id="request-form" hidden>
      <label for="email">Account email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="request-submit" type="submit">Send recovery link</button>
    </form>
    <p id="status" role="status" aria-live="polite">Checking recovery link…</p>
  </main>
  <script>
    const client = window.supabase.createClient(
      'https://dsvapacndcszdgmvyaub.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6ImRzdmFwYWNuZGNzemRnbXZ5YXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTQ3NDksImV4cCI6MjA5OTc5MDc0OX0.fDpPlp9nmdtgbkdADlx-9pALvZxDIftKlwYkxvSHSxA',
      { auth: { detectSessionInUrl: true } }
    );
    const status = document.getElementById('status');
    const resetForm = document.getElementById('reset-form');
    const requestForm = document.getElementById('request-form');
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const linkError = hash.get('error_description') || query.get('error_description');

    async function initialize() {
      if (linkError) {
        status.textContent = 'This recovery link is invalid or expired. Request a new one below.';
        status.classList.add('error');
        requestForm.hidden = false;
        return;
      }
      const { data } = await client.auth.getSession();
      if (data.session) {
        history.replaceState({}, document.title, location.pathname);
        status.textContent = 'Recovery verified. Choose a new password.';
        resetForm.hidden = false;
      } else {
        status.textContent = 'Enter your account email and we will send a recovery link.';
        document.getElementById('email').value = query.get('email') || '';
        requestForm.hidden = false;
      }
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirm-password').value;
      const button = document.getElementById('reset-submit');
      if (password.length < 8 || password !== confirmation) {
        status.textContent = password !== confirmation
          ? 'Passwords do not match.'
          : 'Use at least 8 characters.';
        status.classList.add('error');
        return;
      }
      button.disabled = true;
      const { error } = await client.auth.updateUser({ password });
      button.disabled = false;
      if (error) {
        status.textContent = error.message;
        status.classList.add('error');
        return;
      }
      status.classList.remove('error');
      status.textContent = 'Password updated. Return to Alliance Matrimony and sign in.';
      resetForm.hidden = true;
    });

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('request-submit');
      button.disabled = true;
      const { error } = await client.auth.resetPasswordForEmail(
        document.getElementById('email').value.trim(),
        { redirectTo: location.origin + location.pathname }
      );
      button.disabled = false;
      if (error) {
        status.textContent = error.message;
        status.classList.add('error');
        return;
      }
      status.classList.remove('error');
      status.textContent = 'If that account exists, a recovery link has been sent.';
      requestForm.hidden = true;
    });

    initialize();
  </script>
</body>
</html>
